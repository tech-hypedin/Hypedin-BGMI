  #     resources:
  #       limits:
  #         memory: 128M

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    container_name: hypedin-BGMI_redis
    restart: always
    networks:
      - hypedin-BGMI_network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: hypedin-BGMI_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - hypedin-BGMI_network
    deploy:
      resources:
        limits:
          memory: 2GB
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:latest
    container_name: hypedin-BGMI_mongo-express
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL}
    depends_on:
      - mongodb
    restart: always
    networks:
      - hypedin-BGMI_network
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    container_name: hypedin-BGMI_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_LIFETIME: ${JWT_LIFETIME}
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: ${NODE_ENV}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID}
      GOOGLE_CLIENT_EMAIL: ${GOOGLE_CLIENT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
      GOOGLE_SHEETS_ID_FOR_CONTACT_FORM: ${GOOGLE_SHEETS_ID_FOR_CONTACT_FORM}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
      GOOGLE_CLIENT_ID_IMAGE: ${GOOGLE_CLIENT_ID_IMAGE}
      GOOGLE_CLIENT_SECRET_IMAGE: ${GOOGLE_CLIENT_SECRET_IMAGE}
      GOOGLE_REDIRECT_URI_IMAGE: ${GOOGLE_REDIRECT_URI_IMAGE}
      GOOGLE_REFRESH_TOKEN_IMAGE: ${GOOGLE_REFRESH_TOKEN_IMAGE}
      STUDENT_DASHBOARD_LINK: ${STUDENT_DASHBOARD_LINK}
      NOMINATIONS_SHEET_ID: ${NOMINATIONS_SHEET_ID}
      PLAYER_ID_FOLDER: ${PLAYER_ID_FOLDER}
      NOMINATIONS_DRIVE_FOLDER_ID: ${NOMINATIONS_DRIVE_FOLDER_ID}
      PLAYER_REFERALS_SHEET: ${PLAYER_REFERALS_SHEET}
      TASK_GSHEET: ${TASK_GSHEET}
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - hypedin-BGMI_network
    deploy:
      resources:
        limits:
          memory: 3GB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: hypedin-BGMI_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hypedin-BGMI_network
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1GB

networks:
  hypedin-BGMI_network:
    driver: bridge

volumes:
  mongodb_data: